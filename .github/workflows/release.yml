# Tag a version (git tag -a v0.1.0.0 -m "what changed" && git push --tags) and
# this builds the plugin, publishes it as a GitHub release, and adds it to
# manifest.json so Jellyfin offers the update. auto-tag.yml calls it too,
# because a tag pushed with the workflow token doesn't start other workflows.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tag:
        description: The annotated tag to release, such as v1.2.3.4
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      # setup-dotnet falls back to Microsoft's origin server, which answered
      # 409 on 2026-10-25; when it fails, install from Microsoft's CDN instead
      - uses: actions/setup-dotnet@v6
        id: setup-dotnet
        continue-on-error: true
        with:
          dotnet-version: "10.0.x"

      - name: Install .NET from the CDN
        if: steps.setup-dotnet.outcome == 'failure'
        run: |
          curl -sSL https://dot.net/v1/dotnet-install.sh -o "$RUNNER_TEMP/dotnet-install.sh"
          bash "$RUNNER_TEMP/dotnet-install.sh" --channel 10.0 --install-dir "$HOME/.dotnet" \
            --azure-feed https://builds.dotnet.microsoft.com/dotnet
          echo "$HOME/.dotnet" >> "$GITHUB_PATH"
          echo "DOTNET_ROOT=$HOME/.dotnet" >> "$GITHUB_ENV"

      - name: Read the version from the tag
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must look like v1.2.3.4, got $TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The annotated tag's message is the changelog. actions/checkout
          # leaves a plain tag without the message behind, so fetch the real one.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ "$(git cat-file -t "$TAG")" != "tag" ]; then
            echo "Use an annotated tag (git tag -a), its message is the changelog" >&2
            exit 1
          fi
          git for-each-ref "refs/tags/$TAG" --format='%(contents)' > changelog.txt

      # Jellyfin builds every plugin controller at startup; these tests catch
      # what would otherwise stop the server from starting
      - name: Test
        run: dotnet test Jellyfin.Plugin.AniWorldDownloader.Tests

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          dotnet publish Jellyfin.Plugin.AniWorldDownloader -c Release -o artifacts \
            -p:Version="$VERSION" -p:AssemblyVersion="$VERSION" -p:FileVersion="$VERSION"
          zip -j "aniworld-downloader_${VERSION}.zip" artifacts/Jellyfin.Plugin.AniWorldDownloader.dll
          md5sum "aniworld-downloader_${VERSION}.zip" | cut -d' ' -f1 > checksum.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          zip="aniworld-downloader_${VERSION}.zip"
          # Re-running a release replaces its zip and notes instead of failing
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$zip" --clobber
            gh release edit "$TAG" --notes-file changelog.txt
          else
            gh release create "$TAG" "$zip" \
              --title "AniWorld Downloader $VERSION" --notes-file changelog.txt
          fi

      - name: Add it to manifest.json
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/aniworld-downloader_${VERSION}.zip"
          git fetch origin main
          git checkout main
          python3 .github/scripts/update_manifest.py manifest.json "$VERSION" "$url" "$(cat checksum.txt)" "$(cat changelog.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          if git diff --cached --quiet; then
            echo "manifest.json already up to date"
          else
            git commit -m "add $VERSION to manifest.json"
            git push origin main
          fi
