<!DOCTYPE html>
<!--
    Shows the plugin page without Jellyfin or a build: loads Web/client.js
    straight from the repo and answers its calls from dev/fixtures.js.
    Change client.js, then reload this page.

    Serve the repo root, for example "python -m http.server 8765", and open
    http://localhost:8765/dev/preview.html. Make fixtures.js with capture.js.
    Posters and Jellyfin's styles come from the server that made the fixtures,
    so that server has to be reachable. Nothing here reaches AniWorld: saves,
    downloads and sync runs only change this page's copy of the data.
-->
<html lang="en" dir="ltr" class="layout-desktop">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AniWorld preview</title>
    <!-- Never a cached copy, or a new capture doesn't show up -->
    <script>document.write('<script src="fixtures.js?' + Date.now() + '"><\/script>');</script>
    <script>
        (function () {
            var fixtures = window.ANIWORLD_FIXTURES;
            if (!fixtures) {
                return;
            }

            // With the SleekFin switch on: the stylesheets, inline styles and
            // page classes capture.js saved from the server, SleekFin's among them
            var details = fixtures.details;
            // In phone mode this window only holds the frame, so it stays stock
            var sleekFin = false;
            try {
                var chosen = JSON.parse(window.localStorage.getItem('aniworldPreview') || '{}');
                sleekFin = Boolean(chosen.sleekfin) && Boolean(details && details.stylesheets) &&
                    !(chosen.phone && window.self === window.top);
            } catch (e) { /* stock look */ }

            window.previewSleekFin = sleekFin;
            if (sleekFin) {
                details.stylesheets.forEach(function (href) {
                    document.write('<link rel="stylesheet" href="' + href + '">');
                });
                details.styles.forEach(function (css) {
                    document.write('<style>' + css.replace(/<\/style/gi, '<\\/style') + '</style>');
                });
                document.documentElement.className += ' ' + details.htmlClass;
                return;
            }

            // jellyfin-web's own styles, so the page looks like it does there.
            // The hashed names change with a Jellyfin update: copy the new ones
            // from the <link> tags of the real page.
            [
                'web/1133.03edf3bb7ee048ee10be.css',
                'web/main.jellyfin.d0fe7ebed50c35511f89.css',
                'web/78701.1521101b7f45094b7ce3.css',
                'web/search.d8744ed84b1a641aee12.css',
                'web/25348.10043daf2671fc8859af.css',
                'web/73560.49e7c92878ed0bb4fad6.css',
                'web/14245.f517756c675c2040ffba.css',
                'web/91737.46d2c499ae1164063e43.css',
                'web/32721.bfde69083a6ae513ba97.css',
                'web/68603.bfde69083a6ae513ba97.css',
                'web/69881.85d5c8ac3936b68e702e.css',
                'web/76542.033e6959b8ca2bb863d3.css',
                'web/47472.ead193e1e4096120377c.css',
                'web/themes/dark/theme.css',
                'Branding/Css'
            ].forEach(function (path) {
                document.write('<link rel="stylesheet" href="' + fixtures.server + '/' + path + '">');
            });
        })();
    </script>
    <style>
        /* From the inline <style> in jellyfin-web's index.html */
        html { background-color: #101010; color: rgba(255, 255, 255, .7); }
        .hide, .layout-desktop .hide-desktop, .layout-mobile .hide-mobile, .layout-tv .hide-tv { display: none !important; }

        body { margin: 0; }
        .preview-header { display: flex; align-items: center; gap: 1.5em; padding: .9em 1.5em; font: 500 .9em sans-serif; }
        .preview-header a { color: inherit; text-decoration: none; display: inline-flex; align-items: center; gap: .3em; }
        .preview-header svg { width: 1.2em; height: 1.2em; fill: currentColor; }
        .preview-tools { position: fixed; right: 1em; bottom: 1em; z-index: 10000; display: flex; flex-wrap: wrap; gap: .4em;
            max-width: 26em; padding: .6em; border-radius: .4em; background: #000c; color: #fff; font: 12px sans-serif; }
        .preview-tools button, .preview-tools label { background: #333; color: #fff; border: 0; border-radius: .3em; padding: .45em .7em;
            font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: .3em; }
        .preview-tools .preview-note { width: 100%; opacity: .7; }
        .preview-tools [hidden] { display: none; }
        .preview-missing { font: 16px sans-serif; padding: 2em; max-width: 40em; line-height: 1.5; }
    </style>
</head>
<!-- jellyfin-web sets dir on body too; its item page CSS needs it there -->
<body class="libraryDocument" dir="ltr">
    <div class="backdropContainer"></div>
    <div class="backgroundContainer"></div>
    <div class="preview-frame">
        <!-- client.js clones the Favorites link into its own nav entry -->
        <div class="preview-header">
            <strong>Preview</strong>
            <a href="#/home?tab=1"><svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54z"/></svg><span>Favorites</span></a>
        </div>
        <div class="skinBody">
            <div id="searchPage" class="page libraryPage allLibraryPage noSecondaryNavPage"></div>
            <!-- Jellyfin's series and season page: the pages capture.js saved
                 with the SleekFin switch on, stock jellyfin-web markup without -->
            <div class="preview-details"></div>
        </div>
    </div>

    <div class="preview-tools">
        <button data-route="">Search</button>
        <button data-route="&q=dragon%20ball">Results</button>
        <button data-route="&u=">Detail</button>
        <button data-route="&view=queue">Queue</button>
        <button data-route="&view=autosync">Auto-Sync</button>
        <button data-details="series">Series page</button>
        <button data-details="season">Season page</button>
        <label><input type="checkbox" class="preview-phone-toggle"> Phone</label>
        <label><input type="checkbox" class="preview-admin-toggle" checked> Admin</label>
        <label><input type="checkbox" class="preview-sleekfin-toggle"> SleekFin</label>
        <label>Seasons <select class="preview-seasons"><option value="newer">newer</option><option value="all">all</option><option value="off">off</option></select></label>
        <span class="preview-note"></span>
    </div>

    <script>
        (function () {
            var fixtures = window.ANIWORLD_FIXTURES;
            if (!fixtures) {
                document.body.innerHTML = '<div class="preview-missing">No <code>dev/fixtures.js</code> yet. Open the AniWorld page ' +
                    'in Jellyfin, paste <code>dev/capture.js</code> into the browser console, and move the downloaded ' +
                    '<code>fixtures.js</code> into the <code>dev/</code> folder.</div>';
                return;
            }

            var replies = JSON.parse(JSON.stringify(fixtures.replies));
            var PREFIX = fixtures.server + '/AniWorldDownloader/';
            var DELAY = 250;
            var status = replies['GET AutoSync/Status'];
            var info = replies['GET Info'] || { configured: true };
            var tracked = (status && status.series && status.series[0]) || null;

            function settings() {
                try {
                    return JSON.parse(window.localStorage.getItem('aniworldPreview') || '{}');
                } catch (e) {
                    return {};
                }
            }

            function save(values) {
                try {
                    window.localStorage.setItem('aniworldPreview', JSON.stringify(Object.assign(settings(), values)));
                } catch (e) { /* the toggles just don't stick */ }
            }

            function later(value) {
                return new Promise(function (resolve) {
                    window.setTimeout(function () { resolve(JSON.parse(JSON.stringify(value))); }, DELAY);
                });
            }

            // ApiClient rejects with the fetch Response; client.js reads .json() off it
            function fail(code, message) {
                return new Promise(function (resolve, reject) {
                    window.setTimeout(function () {
                        reject({ status: code, json: function () { return Promise.resolve({ error: message }); } });
                    }, DELAY);
                });
            }

            function now() {
                return new Date().toISOString();
            }

            function findRow(id) {
                return status && status.series.filter(function (row) { return row.id === id; })[0];
            }

            // Downloads queued on this page: they run one after the other, 20
            // seconds an episode, with progress like ffmpeg's
            var EPISODE_SECONDS = 20;
            var jobs = [];

            function sqliteTime(ms) {
                return ms ? new Date(ms).toISOString().replace('T', ' ').slice(0, 19) : null;
            }

            function addJob(values) {
                var last = jobs[0];
                var startAt = Math.max(Date.now() + 2000, last ? last.endAt : 0);
                var episodes = values.episodes.length ? values.episodes : [''];
                jobs.unshift(Object.assign({
                    id: 1000 + jobs.length,
                    createdAt: Date.now(),
                    startAt: startAt,
                    endAt: startAt + episodes.length * EPISODE_SECONDS * 1000,
                    episodes: episodes
                }, values));
                return jobs[0].id;
            }

            // A job as AniWorld's queue lists it at this moment, and ffmpeg's
            // progress if it is the one running
            function jobNow(job, ffmpeg) {
                var t = Date.now();
                var count = job.episodes.length;
                var item = {
                    id: job.id, title: job.title, series_url: job.seriesUrl, language: job.language, provider: job.provider,
                    source: job.source, total_episodes: count, current_episode: 0, current_url: '',
                    created_at: sqliteTime(job.createdAt), started_at: null, completed_at: null, duration_seconds: null,
                    errors: '[]', status: 'queued'
                };
                if (settings().admin !== false) {
                    item.requestedBy = 'preview';
                }

                if (t < job.startAt) {
                    return item;
                }

                item.started_at = sqliteTime(job.startAt);
                item.duration_seconds = Math.round((Math.min(t, job.endAt) - job.startAt) / 1000);
                // The second episode of a job fails, so the errors show
                var errors = count >= 2 && t >= job.startAt + 2 * EPISODE_SECONDS * 1000
                    ? [{ url: job.episodes[1], error: 'Download failed for all providers. VOE: 404 Not Found' }]
                    : [];
                item.errors = JSON.stringify(errors);
                if (t >= job.endAt) {
                    item.status = 'completed';
                    item.current_episode = count;
                    item.completed_at = sqliteTime(job.endAt);
                    return item;
                }

                var into = (t - job.startAt) / 1000;
                var index = Math.floor(into / EPISODE_SECONDS);
                var part = (into % EPISODE_SECONDS) / EPISODE_SECONDS;
                // A 24-minute episode, read 72 times faster than real time
                var media = part * 1440;
                item.status = 'running';
                item.current_episode = index;
                item.current_url = job.episodes[index];
                Object.assign(ffmpeg, {
                    active: true,
                    percent: Math.round(part * 1000) / 10,
                    time: new Date(media * 1000).toISOString().slice(11, 22),
                    speed: (1440 / EPISODE_SECONDS) + 'x',
                    bandwidth: '6.4 MB/s'
                });
                return item;
            }

            // The captured queue; retry, remove and clear change it
            var fixtureQueue = replies['GET Queue?limit=30'] || { items: [] };
            var FINISHED = ['completed', 'failed', 'cancelled'];

            function queueReply() {
                var reply = JSON.parse(JSON.stringify(fixtureQueue));
                var ffmpeg = { active: false, percent: 0, speed: '', time: '', bandwidth: '' };
                var mine = jobs.map(function (job) { return jobNow(job, ffmpeg); });
                reply.items = mine.concat(reply.items || []);
                reply.total = (reply.total || 0) + mine.length;
                // The captured queue's rows beyond the fixture are old, finished ones
                reply.counts = Object.assign({}, reply.counts, {
                    finished: reply.items.filter(function (item) { return FINISHED.indexOf(item.status) >= 0; }).length +
                        Math.max(0, (fixtureQueue.total || 0) - fixtureQueue.items.length)
                });
                reply.ffmpeg_progress = ffmpeg;
                return later(reply);
            }

            function queueAction(method, id, action) {
                var item = fixtureQueue.items.filter(function (row) { return row.id === id; })[0];
                var job = jobs.filter(function (row) { return row.id === id; })[0];
                var done = job && jobNow(job, {});
                var current = item || done;
                if (!current) {
                    return fail(404, 'Item not found');
                }

                if (method === 'DELETE') {
                    if (current.status === 'running') {
                        return fail(400, 'Cancel the item before removing it');
                    }

                    fixtureQueue.items = fixtureQueue.items.filter(function (row) { return row.id !== id; });
                    fixtureQueue.total -= item ? 1 : 0;
                    jobs = jobs.filter(function (row) { return row.id !== id; });
                    return later({ ok: true });
                }

                if (action === 'Retry') {
                    if (current.status !== 'failed' && current.status !== 'cancelled') {
                        return fail(400, 'Item not found or not retryable');
                    }

                    // Runs again as one of this page's downloads
                    fixtureQueue.items = fixtureQueue.items.filter(function (row) { return row.id !== id; });
                    fixtureQueue.total -= item ? 1 : 0;
                    jobs = jobs.filter(function (row) { return row.id !== id; });
                    addJob({
                        title: current.title, seriesUrl: current.series_url, language: current.language, provider: current.provider,
                        source: current.source, episodes: new Array(current.total_episodes || 1).fill(current.current_url || '')
                    });
                    return later({ ok: true });
                }

                // Moving needs the real queue's order; here it only answers
                return current.status === 'queued' ? later({ ok: true }) : fail(400, 'Only queued items can be moved');
            }

            // Pretends a sync ran: "running" for a few seconds, then each
            // series had one new episode, queued as an Auto-Sync download
            function fakeRun(rows) {
                if (status.running) {
                    return fail(409, 'A sync is already running');
                }

                status.running = true;
                window.setTimeout(function () {
                    status.running = false;
                    rows.forEach(function (row) {
                        row.last_checked = now();
                        row.last_result = { status: 'queued', episodes: 1 };
                        addJob({
                            title: row.title, seriesUrl: row.series_url, language: row.language, provider: 'VOE', source: 'autosync',
                            episodes: [row.series_url + '/staffel-1/episode-3']
                        });
                    });
                    status.last_report = { checked: rows.length, queued: rows.length, results: [] };
                }, 4000);
                return later({ ok: true, started: true });
            }

            // The series capture.js saved pages of, as it is. Without one, a
            // title from the fixtures that is in the library stands in for it,
            // with its last episode left out of Jellyfin's list and marked not
            // downloaded, so there is something missing.
            var details = fixtures.details;
            var jellyfinItems = {};
            if (details) {
                jellyfinItems = details.items;
                window.previewDetails = { series: details.series, season: details.season };
            }

            var librarySeries = details ? null : Object.keys(replies).filter(function (key) {
                return /^GET Series\?/.test(key) && replies[key].libraryItemId &&
                    replies['GET Shows/' + replies[key].libraryItemId + '/Episodes'];
            }).map(function (key) {
                return { url: decodeURIComponent(key.slice('GET Series?url='.length)), item: replies[key] };
            })[0] || null;
            if (librarySeries) {
                var seriesId = librarySeries.item.libraryItemId;
                var showsKey = 'GET Shows/' + seriesId + '/Episodes';
                var gap = replies[showsKey].Items.filter(function (ep) { return ep.ParentIndexNumber === 1; }).pop();
                if (gap) {
                    replies[showsKey].Items = replies[showsKey].Items.filter(function (ep) { return ep !== gap; });
                    Object.keys(replies).forEach(function (key) {
                        if (/^GET Episodes\?/.test(key) && key.indexOf(encodeURIComponent(librarySeries.url + '/staffel-1')) >= 0) {
                            replies[key].episodes.forEach(function (ep) {
                                if (ep.episode_number === gap.IndexNumber) {
                                    ep.downloaded = false;
                                }
                            });
                        }
                    });
                }

                // Jellyfin's own season 1 when the fixtures have it, a made-up one otherwise
                var seasonsKey = 'GET Shows/' + seriesId + '/Seasons';
                var seasonOne = replies[seasonsKey] && replies[seasonsKey].Items.filter(function (s) { return s.IndexNumber === 1; })[0];
                var seasonId = seasonOne ? seasonOne.Id : 'preview-season-1';
                jellyfinItems[seriesId] = { Id: seriesId, Type: 'Series', Name: librarySeries.item.title };
                jellyfinItems[seasonId] = { Id: seasonId, Type: 'Season', SeriesId: seriesId, IndexNumber: 1, Name: 'Season 1' };
                if (!seasonOne) {
                    replies[seasonsKey] = { Items: [jellyfinItems[seasonId]] };
                }

                // For the toolbar's Series page and Season page buttons
                window.previewDetails = { series: seriesId, season: seasonId };
            }

            // What the plugin's controller would answer, from the fixtures
            // plus whatever was changed on this page
            function answer(method, path, body) {
                var key = method + ' ' + path;
                var match;
                if (method === 'GET' && (match = /^FindSource\?itemId=(.*)$/.exec(path)) && !replies[key]) {
                    return librarySeries && decodeURIComponent(match[1]) === librarySeries.item.libraryItemId
                        ? later({ url: librarySeries.url, title: librarySeries.item.title, site: 'aniworld' })
                        : later({ query: 'Unknown' });
                }

                if (method === 'GET' && path === 'Info') {
                    var admin = settings().admin !== false;
                    return later(Object.assign({}, info, {
                        isAdmin: admin, canDownload: true, canManageSync: admin && Boolean(status),
                        // The plugin setting, picked in the toolbar
                        missingSeasons: settings().missingSeasons || info.missingSeasons || 'newer'
                    }));
                }

                if (method === 'GET' && path === 'AutoSync/Status' && status) {
                    return later(status);
                }

                if (method === 'POST' && path === 'AutoSync/Run' && status) {
                    return fakeRun(status.series);
                }

                if ((match = /^AutoSync\/Series\/(\d+)(\/Run)?$/.exec(path)) && status) {
                    var row = findRow(Number(match[1]));
                    if (!row) {
                        return fail(404, 'Not found');
                    }

                    if (method === 'POST' && match[2]) {
                        return fakeRun([row]);
                    }

                    if (method === 'PUT') {
                        Object.assign(row, body);
                        row.schedule = row.cadence === 'daily' ? 'Every day at ' + row.run_time
                            : row.cadence === 'weekly' ? 'Every week at ' + row.run_time : status.schedule;
                        return later({ ok: true, series: row });
                    }

                    if (method === 'DELETE') {
                        status.series.splice(status.series.indexOf(row), 1);
                        return later({ ok: true });
                    }
                }

                if (method === 'GET' && (match = /^AutoSync\/Tracked\?url=(.*)$/.exec(path))) {
                    var url = decodeURIComponent(match[1]);
                    var known = status && status.series.filter(function (r) { return r.series_url === url; })[0];
                    return later(known ? { tracked: true, series: known } : { tracked: false, series: null });
                }

                if (method === 'POST' && path === 'AutoSync/Tracked') {
                    if (!body.tracked) {
                        status.series = status.series.filter(function (r) { return r.series_url !== body.series_url; });
                        return later({ ok: true, tracked: false });
                    }

                    var existing = status.series.filter(function (r) { return r.series_url === body.series_url; })[0];
                    var next = Object.assign({}, tracked, existing || { id: Date.now(), last_checked: null, last_result: null }, body);
                    delete next.tracked;
                    if (!existing) {
                        status.series.push(next);
                    } else {
                        Object.assign(existing, next);
                    }

                    return later({ ok: true, tracked: true, series: next });
                }

                if (method === 'POST' && path === 'Download') {
                    return later({
                        ok: true,
                        queue_id: addJob({
                            title: body.Title, seriesUrl: body.SeriesUrl, language: body.Language, provider: body.Provider,
                            source: 'manual', episodes: body.Episodes || []
                        })
                    });
                }

                if (method === 'POST' && (match = /^Queue\/(\d+)\/Cancel$/.exec(path))) {
                    jobs = jobs.filter(function (job) { return job.id !== Number(match[1]); });
                    return later({ ok: true });
                }

                if (method === 'DELETE' && path === 'Queue/Finished') {
                    if (settings().admin === false) {
                        return fail(403, 'Only admins can clear the finished downloads');
                    }

                    fixtureQueue.items = fixtureQueue.items.filter(function (row) { return FINISHED.indexOf(row.status) < 0; });
                    fixtureQueue.total = fixtureQueue.items.length;
                    fixtureQueue.counts = Object.assign({}, fixtureQueue.counts, { finished: 0 });
                    jobs = jobs.filter(function (job) { return Date.now() < job.endAt; });
                    return later({ ok: true });
                }

                if ((match = /^Queue\/(\d+)(?:\/(Retry|Move))?$/.exec(path)) && (method === 'DELETE' || match[2])) {
                    return queueAction(method, Number(match[1]), match[2]);
                }

                if (method === 'GET' && /^Queue\?/.test(path)) {
                    return queueReply();
                }

                // Jellyfin's own calls are kept without their query, which
                // carries the user ID
                if (method === 'GET' && (match = /^(Shows\/[^/]+\/(?:Episodes|Seasons))\?/.exec(path))) {
                    return replies['GET ' + match[1]] ? later(replies['GET ' + match[1]]) : fail(404, 'Not in the fixtures: ' + key);
                }

                if (replies[key]) {
                    return later(replies[key]);
                }

                return fail(404, 'Not in the fixtures: ' + key);
            }

            window.ApiClient = {
                serverAddress: function () { return fixtures.server; },
                serverId: function () { return 'preview'; },
                accessToken: function () { return 'preview'; },
                getCurrentUserId: function () { return 'preview'; },
                getUrl: function (path, params) {
                    var query = params ? '?' + new URLSearchParams(params).toString() : '';
                    return fixtures.server + '/' + path.replace(/^\//, '') + query;
                },
                ajax: function (options) {
                    var path = options.url.indexOf(PREFIX) === 0 ? options.url.slice(PREFIX.length)
                        : options.url.indexOf(fixtures.server + '/') === 0 ? options.url.slice(fixtures.server.length + 1) : options.url;
                    return answer(options.type || 'GET', path, options.data ? JSON.parse(options.data) : null);
                },
                getItem: function (userId, id) {
                    return jellyfinItems[id] ? later(jellyfinItems[id]) : Promise.reject(new Error('Not in the preview'));
                }
            };

            // SearchStream: the fixture search, one site per line, like the real stream
            var realFetch = window.fetch.bind(window);
            window.fetch = function (url, options) {
                if (String(url).indexOf(PREFIX + 'SearchStream') !== 0) {
                    return realFetch(url, options);
                }

                var results = (replies['POST Search'] || {}).results || [];
                var sites = results.map(function (r) { return r.site; }).filter(function (s, i, all) { return all.indexOf(s) === i; });
                var encoder = new TextEncoder();
                var stream = new ReadableStream({
                    start: function (controller) {
                        sites.forEach(function (site, i) {
                            window.setTimeout(function () {
                                controller.enqueue(encoder.encode(JSON.stringify({
                                    site: site,
                                    results: results.filter(function (r) { return r.site === site; }),
                                    pending: sites.slice(i + 1)
                                }) + '\n'));
                                if (i === sites.length - 1) {
                                    controller.enqueue(encoder.encode('{"done":true}\n'));
                                    controller.close();
                                }
                            }, DELAY * (i + 1));
                        });
                        if (!sites.length) {
                            controller.enqueue(encoder.encode('{"done":true}\n'));
                            controller.close();
                        }
                    }
                });
                return Promise.resolve(new Response(stream, { status: 200 }));
            };

            // jellyfin-web's Dashboard isn't here; client.js doesn't need it
            window.AniWorldDownloaderBuild = 'preview, fixtures from ' + new Date(fixtures.captured).toLocaleString();

            // The toolbar. In phone mode the page runs in a 390px frame, so the
            // plugin's phone styles (they go by the window's width) kick in;
            // the toolbar then stays out here and steers the frame.
            var framed = window.self !== window.top;
            if (framed) {
                // What jellyfin-web sets on phones and in the Android app
                document.documentElement.className = 'layout-mobile' + (window.previewSleekFin ? ' ' + details.htmlClass : '');
            }

            if (window.previewSleekFin) {
                document.body.className = details.bodyClass;
            }

            var tools = document.querySelector('.preview-tools');
            var target = window;
            if (framed) {
                tools.remove();
            } else if (settings().phone) {
                document.querySelector('.preview-frame').remove();
                // Jellyfin's fixed backdrop layers would cover the frame
                document.querySelectorAll('.backdropContainer, .backgroundContainer').forEach(function (node) {
                    node.remove();
                });
                var frame = document.createElement('iframe');
                // Never a cached copy, or the frame lags behind edits to this file
                frame.src = 'preview.html?' + Date.now() + window.location.hash;
                frame.style.cssText = 'display:block;width:390px;height:844px;margin:1em auto;border:1px solid #555;border-radius:1em;background:#101010';
                document.body.insertBefore(frame, tools);
                target = frame.contentWindow;
            }

            if (!framed) {
                setUpTools(target);
            }

            if (window.location.hash.indexOf('#/search?aniworld') !== 0 && window.location.hash.indexOf('#/details?') !== 0) {
                window.location.hash = '#/search?aniworld';
            }

            // Jellyfin's details page for the series and its season: the saved
            // page with SleekFin, or the markup of jellyfin-web's itemDetails.html
            function drawDetails() {
                var holder = document.querySelector('.preview-details');
                var backdrop = document.querySelector('.backdropContainer');
                // In phone mode this window only holds the frame
                if (!holder) {
                    return;
                }

                var id = /^#\/details\?id=([^&]*)/.exec(window.location.hash);
                var item = id && jellyfinItems[decodeURIComponent(id[1])];
                var saved = item && window.previewSleekFin && details.pages[item.Id];
                document.getElementById('searchPage').classList.toggle('hide', Boolean(item));
                document.querySelector('.backgroundContainer').classList.toggle('withBackdrop', Boolean(saved));
                backdrop.innerHTML = saved ? saved.backdrop : '';
                // The theme's classes as they were on that page
                if (window.previewSleekFin) {
                    var layout = document.documentElement.className.split(' ').filter(function (name) { return /^layout-/.test(name); });
                    document.documentElement.className = layout.concat((saved || details).htmlClass || '').join(' ');
                }

                if (!item) {
                    holder.innerHTML = '';
                    return;
                }

                if (saved) {
                    holder.innerHTML = saved.html;
                    // Jellyfin's lazy loader isn't here: show the images below the fold at once
                    holder.querySelectorAll('[data-src]').forEach(function (node) {
                        if (node.tagName === 'IMG') {
                            node.src = node.getAttribute('data-src');
                        } else {
                            node.style.backgroundImage = 'url("' + node.getAttribute('data-src') + '")';
                        }

                        node.classList.remove('lazy-hidden');
                    });
                    holder.querySelectorAll('.lazy-hidden-children').forEach(function (node) {
                        node.classList.remove('lazy-hidden-children');
                    });
                    return;
                }

                var children;
                if (item.Type === 'Series') {
                    var season = jellyfinItems[window.previewDetails.season];
                    children = '<div class="itemsContainer vertical-wrap padded-right">' +
                        '<div class="card overflowPortraitCard card-hoverable" data-type="Season" data-id="' + season.Id + '">' +
                        '<div class="cardBox cardBox-bottompadded"><div class="cardScalable"><div class="cardPadder cardPadder-overflowPortrait"></div>' +
                        '<a class="cardImageContainer coveredImage cardContent defaultCardBackground defaultCardBackground2" href="#/details?id=' + season.Id + '"></a></div>' +
                        '<div class="cardFooter"><div class="cardText cardTextCentered cardText-first"><bdi>' + season.Name + '</bdi></div></div></div></div></div>';
                } else {
                    var episodes = replies['GET Shows/' + item.SeriesId + '/Episodes'].Items.filter(function (ep) {
                        return ep.ParentIndexNumber === item.IndexNumber;
                    });
                    children = '<div class="itemsContainer vertical-list padded-right">' + episodes.map(function (ep) {
                        return '<div class="listItem listItem-largeImage listItem-withContentWrapper" data-type="Episode" data-id="' + ep.Id + '">' +
                            '<div class="listItem-content"><div class="listItemBody"><h3 class="listItemBodyText">' + ep.IndexNumber + '. ' + ep.Name + '</h3>' +
                            '</div></div></div>';
                    }).join('') + '</div>';
                }

                holder.innerHTML = '<div id="itemDetailPage" class="page libraryPage itemDetailPage noSecondaryNavPage selfBackdropPage">' +
                    '<div class="detailPageWrapperContainer"><div class="detailPagePrimaryContainer padded-left padded-right">' +
                    '<div class="nameContainer"><h1 class="itemName infoText">' + item.Name + '</h1></div></div>' +
                    '<div class="detailPagePrimaryContent padded-left padded-right"><div class="detailSection">' +
                    '<div id="listChildrenCollapsible" class="verticalSection detailVerticalSection">' +
                    '<h2 class="sectionTitle sectionTitle-cards">' + (item.Type === 'Series' ? 'Seasons' : 'Episodes') + '</h2>' +
                    '<div id="childrenContent">' + children + '</div></div></div></div>' +
                    '<div class="detailPageSecondaryContainer padded-left padded-bottom-page"></div></div></div>';
            }

            window.addEventListener('hashchange', drawDetails);
            drawDetails();

            if (target === window) {
                var script = document.createElement('script');
                script.src = '../Jellyfin.Plugin.AniWorldDownloader/Web/client.js?' + Date.now();
                document.body.appendChild(script);
            }
        })();

        function setUpTools(target) {
            var fixtures = window.ANIWORLD_FIXTURES;
            var status = fixtures.replies['GET AutoSync/Status'];
            var tracked = status && status.series && status.series[0];
            var detailUrl = tracked ? tracked.series_url : '';
            function settings() {
                try {
                    return JSON.parse(window.localStorage.getItem('aniworldPreview') || '{}');
                } catch (e) {
                    return {};
                }
            }

            function save(values) {
                try {
                    window.localStorage.setItem('aniworldPreview', JSON.stringify(Object.assign(settings(), values)));
                } catch (e) { /* the toggles just don't stick */ }
            }

            document.querySelectorAll('[data-route]').forEach(function (button) {
                button.addEventListener('click', function () {
                    var extra = button.getAttribute('data-route');
                    target.location.hash = '#/search?aniworld' + (extra === '&u=' ? '&u=' + encodeURIComponent(detailUrl) : extra);
                });
            });

            var details = window.previewDetails;
            document.querySelectorAll('[data-details]').forEach(function (button) {
                button.hidden = !details;
                button.addEventListener('click', function () {
                    target.location.hash = '#/details?id=' + details[button.getAttribute('data-details')];
                });
            });

            var phone = document.querySelector('.preview-phone-toggle');
            phone.checked = Boolean(settings().phone);
            phone.addEventListener('change', function () {
                save({ phone: phone.checked });
                window.location.reload();
            });

            var sleekFin = document.querySelector('.preview-sleekfin-toggle');
            sleekFin.checked = Boolean(settings().sleekfin);
            sleekFin.parentNode.hidden = !(fixtures.details && fixtures.details.stylesheets);
            sleekFin.addEventListener('change', function () {
                save({ sleekfin: sleekFin.checked });
                window.location.reload();
            });

            var seasons = document.querySelector('.preview-seasons');
            seasons.value = settings().missingSeasons || 'newer';
            seasons.addEventListener('change', function () {
                save({ missingSeasons: seasons.value });
                window.location.reload();
            });

            var admin = document.querySelector('.preview-admin-toggle');
            admin.checked = settings().admin !== false;
            admin.addEventListener('change', function () {
                save({ admin: admin.checked });
                window.location.reload();
            });

            document.querySelector('.preview-note').textContent =
                'Fixtures from ' + fixtures.server + ', ' + new Date(fixtures.captured).toLocaleString() + '. Changes stay on this page.';
        }
    </script>
</body>
</html>
